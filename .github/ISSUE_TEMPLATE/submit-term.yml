name: 召唤怪兽
description: 撞见一个不好懂的 AI 黑话？带上原话，把它召唤进图鉴
body:
  - type: markdown
    attributes:
      value: |
        不用判断这词是不是黑话、值不值得召唤——那是收录人的事。
        你只需要带上这个词和它出没时的原话。原话别润色，它本身就是证据。
  - type: input
    id: term
    attributes:
      label: 召唤哪只怪兽？
      description: AI 会输出的一些特别 AI 味的词语，如「最狠的」「兜住你」
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: 原话 / 出没现场（选填）
      description: 你当时看到的完整句子，如果有的话，可以粘贴进来。照录，别润色。
  - type: textarea
    id: note
    attributes:
      label: 其他线索（选填）
