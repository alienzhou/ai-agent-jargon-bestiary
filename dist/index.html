<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 黑话的怪兽图鉴</title>
<style>
/* AI 黑话的怪兽图鉴 —— 复古街机卡牌 / 丝网印
   设计原则：元素少而大。一屏一张卡，粗描边 + 硬阴影，不做细碎装饰堆叠。 */
:root {
  --paper: #f2e8d5;
  --card: #fffaf0;
  --ink: #1a1815;
  --red: #b4342c;
  --gold: #c9a227;
  --blue: #2f5d7c;
  --dim: #7b7263;
  --line: #1a1815;
  --shadow: 6px 6px 0 var(--ink);
  --shadow-sm: 4px 4px 0 var(--ink);
  /* 顶部条实测高度，由 app.js 的 syncTopH() 写入。翻页条靠它吸在顶部条正下方 */
  --topH: 50px;
}

* { box-sizing: border-box; }

/* 触屏点击时系统会盖一层半透明灰块，和这里的硬阴影 + :active 位移叠在一起
   像是按坏了。自己已经给了按下反馈，把系统那层关掉。 */
html {
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; /* iOS 横屏会自作主张放大正文 */
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.7 system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* 丝网印半调网点底纹：整页唯一的纹理，不再叠别的 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: radial-gradient(var(--ink) 1px, transparent 1.2px);
  background-size: 7px 7px;
  opacity: 0.07;
}

img { max-width: 100%; }
button { font: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible, a:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}
button:focus:not(:focus-visible), summary:focus:not(:focus-visible) { outline: none; }

/* ============ 开场：投币启动 ============
   四拍：待机闪烁 → 金币落进币口 → CRT 通电（扫描线扫过 + 内容轻抖）→ 整屏退场。
   时序写死在这里，app.js 的 boot() 按同样的毫秒数触发音效——改一边必须改另一边。 */
#boot {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: var(--red);
  display: grid;
  place-items: center;
  text-align: center;
  color: var(--paper);
  overflow: hidden;
  transition: opacity 0.45s ease, transform 0.45s ease;
  cursor: pointer;
  /* iOS Safari 上 body{overflow:hidden} 锁不住滚动（橡皮筋照样走），
     开场页会被手指拖动、露出下面还没准备好的正文。这层自己吃掉手势 */
  touch-action: none;
  overscroll-behavior: contain;
}
#boot.gone { opacity: 0; transform: scale(1.08); pointer-events: none; }
#boot .boot-in { position: relative; z-index: 2; }
#boot .logo {
  font-size: clamp(38px, 11vw, 78px);
  font-weight: 900;
  letter-spacing: 0.04em;
  line-height: 1.06;
  text-shadow: 5px 5px 0 var(--ink);
}
#boot .sub {
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: 0.4em;
  opacity: 0.85;
  text-transform: uppercase;
}
#boot .guide { width: min(175px, 40vw); margin: 20px auto 0; display: block; }
#boot .coin {
  margin-top: 22px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.24em;
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0.15; } }

/* 投币口：一条黑槽 + 槽口高光。金币动画沿它落下，落点对准槽心 */
#boot .slot {
  position: relative;
  width: 132px;
  margin: 40px auto 0; /* 留出金币待机悬停的高度，别压到吉祥物身上 */
  height: 34px;
}
#boot .slot .mouth {
  position: absolute;
  left: 50%;
  top: 12px;
  width: 46px;
  height: 9px;
  margin-left: -23px;
  border-radius: 3px;
  background: var(--ink);
  box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.6), 0 2px 0 rgba(242, 232, 213, 0.35);
}
#boot .slot .lit {
  position: absolute;
  left: 0;
  right: 0;
  bottom: -4px;
  font-size: 10px;
  font-style: normal;
  font-weight: 900;
  letter-spacing: 0.28em;
  opacity: 0.55;
}
/* 金币：CSS 画的硬币，默认悬在槽口上方待机浮动 */
#boot .coin-fly {
  position: absolute;
  left: 50%;
  top: -26px;
  width: 26px;
  height: 26px;
  margin-left: -13px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #f2d873, var(--gold) 62%, #8a6f14);
  border: 2.5px solid var(--ink);
  animation: coin-idle 1.6s ease-in-out infinite;
}
@keyframes coin-idle {
  50% { transform: translateY(-6px) rotate(8deg); }
}
/* 投币瞬间：金币旋转下坠，穿过槽口后消失；币口被撞得一沉 */
#boot.inserting .coin-fly {
  animation: coin-drop 0.5s cubic-bezier(0.5, 0, 0.85, 0.4) forwards;
}
@keyframes coin-drop {
  0% { transform: translateY(0) rotateY(0deg); opacity: 1; }
  70% { transform: translateY(42px) rotateY(540deg) scaleX(0.35); opacity: 1; }
  100% { transform: translateY(52px) rotateY(720deg) scaleX(0.1); opacity: 0; }
}
#boot.inserting .slot { animation: slot-knock 0.22s ease-out 0.42s; }
@keyframes slot-knock {
  50% { transform: translateY(3px); }
}
/* 投币后待机提示换成 CREDIT 行：告诉你币吃进去了 */
#boot .ready {
  margin-top: 10px;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.22em;
  color: var(--gold);
  opacity: 0;
}
#boot.inserting .coin { animation: none; opacity: 0; transition: opacity 0.15s; }
#boot.inserting .ready { animation: credit 0.9s steps(2) 0.5s 3; }
@keyframes credit { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

/* 通电：整块内容被电流抖一下 + 一记白闪，然后 CRT 扫描线扫过全屏 */
#boot.powered .boot-in { animation: power-jolt 0.42s ease-out; }
@keyframes power-jolt {
  0% { transform: scale(1); filter: brightness(1); }
  18% { transform: scale(1.06) translateX(-3px); filter: brightness(2.6) contrast(1.4); }
  34% { transform: scale(0.99) translateX(3px); filter: brightness(0.8); }
  60% { transform: scale(1.02); filter: brightness(1.5); }
  100% { transform: scale(1); filter: brightness(1); }
}
#boot .crt {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  opacity: 0;
  background:
    linear-gradient(rgba(242, 232, 213, 0.9), rgba(242, 232, 213, 0) 14%),
    repeating-linear-gradient(rgba(0, 0, 0, 0.16) 0 2px, transparent 2px 4px);
}
#boot.powered .crt { animation: crt-sweep 0.72s ease-out; }
@keyframes crt-sweep {
  0% { opacity: 0.95; transform: translateY(-100%); }
  70% { opacity: 0.5; }
  100% { opacity: 0; transform: translateY(100%); }
}

/* 声音开关：顶部条里最轻的一颗。三态循环，图标是内联 SVG 不是 emoji——
   emoji 在各系统渲染差异极大，而这里需要和粗描边风格一致的线条 */
.fbtn.snd {
  padding: 5px 9px;
  line-height: 0;
}
.fbtn.snd svg { width: 19px; height: 19px; display: block; }
.fbtn.snd.off { opacity: 0.4; }
/* 正在放音乐：金底 + 轻脉动，一眼看出声音是从这儿来的 */
.fbtn.snd.music {
  background: var(--gold);
  animation: snd-pulse 2.2s ease-in-out infinite;
}
@keyframes snd-pulse { 50% { opacity: 0.66; } }

/* 开场页的 BGM 开关：默认就是开的，所以它不是「征求同意」而是「随手能关」。
   降级成左下角一行小字——想关的人扫一眼能找到，不想管的人视线不会被它截住。
   不用原生 checkbox：系统控件的圆角方块和丝网印是两套语言，
   这里做成街机面板上的指示灯，一枚小金币亮着就是「在放」。 */
#boot .bgm-ask {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 4;
  text-align: center;
}
#boot .bgm-ask label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: rgba(242, 232, 213, 0.45);
  cursor: pointer;
  transition: color 0.15s;
}
#boot .bgm-ask input { position: absolute; opacity: 0; pointer-events: none; }
/* 指示灯：灭的时候是个空槽，亮的时候是枚发光的小金币 */
#boot .bgm-ask .led {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid rgba(242, 232, 213, 0.45);
  background: rgba(0, 0, 0, 0.22);
  transition: 0.18s;
}
#boot .bgm-ask label:hover { color: rgba(242, 232, 213, 0.9); }
/* hover 只在「灯没亮」时改边框：否则 label:hover .led（特异性 0,2,1）
   会盖掉下面 input:checked + .led（0,2,1，但排在前面），亮灯直接失效 */
#boot .bgm-ask label:hover input:not(:checked) + .led { border-color: rgba(242, 232, 213, 0.9); }
#boot .bgm-ask input:checked + .led {
  /* 用 background-image 而不是 background 简写：简写会连 background-color 一起重置，
     灭灯态那层 rgba 底色会被抹掉，渐变边缘透出背景 */
  background-image: radial-gradient(circle at 34% 30%, #f2d873, var(--gold) 62%, #8a6f14);
  background-color: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 7px rgba(201, 162, 39, 0.8);
}
#boot .bgm-ask input:checked ~ .txt { color: rgba(242, 232, 213, 0.62); }
#boot .bgm-ask input:focus-visible + .led { outline: 3px solid var(--paper); outline-offset: 2px; }

/* ============ 页面骨架 ============ */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 18px calc(60px + env(safe-area-inset-bottom));
}

/* 顶部条：标题 + 搜筛开关 + 模式切换，压成常驻一行并吸顶。
   首屏空间全部让给卡片——搜索和筛选默认收起，要用才展开。 */
.top {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 -18px;
  padding: 9px 18px 8px;
  background: var(--paper);
  border-bottom: 3px solid var(--line);
}
/* 左上角标题即「回到开头」按钮：清空搜/筛并回到第一只。
   看起来仍是标题（无边框无底色），只在 hover 时给一点位移暗示可点。 */
.brand {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.02em;
  margin-right: auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 0;
  background: none;
  color: inherit;
  font-family: inherit;
  padding: 2px 0;
  cursor: pointer;
  text-align: left;
  transition: 0.12s;
}
.brand:hover { transform: translate(-1px, -1px); text-decoration: underline wavy 2px var(--gold, currentColor); text-underline-offset: 4px; }
.brand:active { transform: translate(1px, 1px); }
.brand:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.brand small {
  margin-left: 7px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--dim);
  white-space: nowrap;
}
.tab, .fbtn {
  padding: 7px 14px;
  border: 3px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-weight: 800;
  font-size: 13px;
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
  transition: 0.12s;
  white-space: nowrap;
}
.tab:hover, .fbtn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.tab:active, .fbtn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.tab.on { background: var(--ink); color: var(--paper); }
/* 筛选开关本身就是状态显示器：收起时也能看到筛在哪 */
.fbtn.act { background: var(--gold); }
.fbtn.open { background: var(--ink); color: var(--paper); }
.fbtn i { font-style: normal; opacity: 0.55; margin-left: 4px; font-size: 11px; }
/* 投喂：header 里唯一的红键。图鉴靠人投喂才长大，这个入口就不能跟「搜/筛」一个分量——
   红底 + 白字 + 慢呼吸，扫一眼就知道这里能动手 */
.coinbtn {
  display: inline-block;
  padding: 7px 15px;
  border: 3px solid var(--line);
  border-radius: 999px;
  background: var(--red);
  color: var(--paper);
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 0.04em;
  white-space: nowrap;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: 0.12s;
  animation: coinpulse 2.6s ease-in-out infinite;
}
.coinbtn:hover {
  transform: translate(-1px, -1px);
  box-shadow: 5px 5px 0 var(--ink);
  animation: none;
}
.coinbtn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); animation: none; }
@keyframes coinpulse {
  0%, 88%, 100% { box-shadow: var(--shadow-sm); }
  94% { box-shadow: 4px 4px 0 var(--ink), 0 0 0 5px rgba(180, 52, 44, 0.22); }
}
@media (prefers-reduced-motion: reduce) {
  .coinbtn { animation: none; }
}

/* 搜索 + 筛选：折叠面板，默认不占位 */
.ctl { margin-bottom: 0; }
.ctl.open { margin-bottom: 14px; }
.ctl .panel { padding-top: 14px; }
.ctl:not(.open) .panel { display: none; }
#q {
  width: 100%;
  padding: 12px 16px;
  border: 3px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  outline: none;
  box-shadow: var(--shadow-sm);
}
#q::placeholder { color: var(--dim); font-weight: 500; }
#q:focus { background: #fffdf6; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.35), var(--shadow-sm); }
.chips { margin-top: 12px; }
.chips .row { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .row + .row { margin-top: 8px; padding-top: 8px; border-top: 2px dashed rgba(26, 24, 21, 0.18); }
.chip {
  padding: 5px 13px;
  border: 2.5px solid var(--line);
  border-radius: 999px;
  background: transparent;
  font-size: 13px;
  font-weight: 700;
  transition: 0.12s;
}
.chip:hover { background: rgba(0, 0, 0, 0.08); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.chip:active { transform: translate(2px, 2px); box-shadow: none; }
.chip.on { background: var(--gold); box-shadow: var(--shadow-sm); }
.kchip.on { background: var(--blue); color: var(--paper); }

/* ============ 图鉴卡牌：一屏一张，元素大 ============ */
#files, #quiz { display: block; }
#quiz { padding-top: 16px; }
/* 图鉴态首元素是自带内边距的吸顶翻页条，这里不再补 padding */
#files[hidden], #quiz[hidden] { display: none; }
.card {
  position: relative;
  background: var(--card);
  border: 4px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 0 0 22px;
  overflow: hidden;
  animation: deal 0.34s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
}
@keyframes deal {
  from { opacity: 0; transform: translateY(18px) rotate(-1.2deg) scale(0.97); }
  to { opacity: 1; transform: none; }
}

/* 卡头：编号条 + 稀有度，一条搞定 */
.card .banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  background: var(--ink);
  color: var(--paper);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.14em;
}
.card .banner .no { opacity: 0.65; }
.card .banner .rare { margin-left: auto; color: var(--gold); letter-spacing: 0.1em; }

/* 卡头：立绘 + 词头左右并排。竖排要吃掉近 300px，横排 160px 就够，
   省下来的高度让整张卡能进首屏。 */
.head {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px 15px;
  background:
    repeating-linear-gradient(-45deg, rgba(180, 52, 44, 0.09) 0 12px, transparent 12px 24px);
  border-bottom: 3px dashed var(--line);
}
.art { flex: none; }
.art img { width: clamp(88px, 26vw, 124px); display: block; filter: drop-shadow(4px 5px 0 rgba(0, 0, 0, 0.14)); }
.art .none {
  width: clamp(88px, 26vw, 124px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  font-size: 44px;
  font-weight: 900;
  color: var(--ink);
  border: 4px dashed var(--line);
  border-radius: 16px;
  opacity: 0.35;
}

/* 词头：全卡最大的字 */
.name { min-width: 0; flex: 1; }
.name .hw {
  font-size: clamp(26px, 6.6vw, 38px);
  font-weight: 900;
  line-height: 1.14;
  letter-spacing: 0.01em;
  overflow-wrap: anywhere;
}
.name .sub {
  margin-top: 3px;
  font-size: 13px;
  font-weight: 700;
  color: var(--dim);
  overflow-wrap: anywhere;
}
.name .sub .slug { font-family: ui-monospace, Menlo, monospace; opacity: 0.7; margin-left: 6px; }
/* 分类 / 词性徽章：从浮在立绘角上改到词头下方，不再绝对定位 */
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.badges span {
  padding: 3px 11px;
  border: 3px solid var(--line);
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.08em;
}
.badges .cat { background: var(--red); color: var(--paper); }
.badges .k-term { background: var(--blue); color: var(--paper); }
.badges .k-alias { background: var(--paper); color: var(--ink); }

/* 内容块：原话照录打头（共鸣钩子），「人话」翻译刮出来 */
.body { padding: 4px 20px 0; }

/* 原话照录：全卡的钩子，一开口就让人应激 */
.quote {
  position: relative;
  margin-top: 14px;
  padding: 20px 18px 13px;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 14px;
}
.quote::after {
  content: '\201C';
  position: absolute;
  top: 0;
  right: 14px;
  font-size: 72px;
  font-weight: 900;
  line-height: 1;
  color: rgba(180, 52, 44, 0.14);
  pointer-events: none;
}
.quote .tag {
  position: absolute;
  top: -13px;
  left: 14px;
  z-index: 2;
  padding: 2px 11px;
  background: var(--ink);
  color: var(--paper);
  border: 3px solid var(--line);
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 900;
  letter-spacing: 0.12em;
}
.quote .say {
  font-size: 19.5px;
  font-weight: 800;
  line-height: 1.62;
}
.quote .yi {
  margin-top: 9px;
  padding-top: 9px;
  border-top: 2px dashed rgba(26, 24, 21, 0.22);
  font-size: 14px;
  font-weight: 600;
  color: var(--dim);
}
.quote .yi::before { content: '译 → '; color: var(--red); font-weight: 900; }
.bubble {
  position: relative;
  margin-top: 14px;
  padding: 16px 18px;
  background: var(--paper);
  border: 3px solid var(--line);
  border-radius: 14px;
  font-size: 16.5px;
  line-height: 1.75;
  font-weight: 600;
}
.bubble .tag {
  position: absolute;
  top: -13px;
  left: 14px;
  padding: 2px 11px;
  background: var(--gold);
  border: 3px solid var(--line);
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 900;
  letter-spacing: 0.12em;
}
.bubble.truth { background: var(--card); }
.bubble.truth .tag { background: var(--red); color: var(--paper); }

/* 词条本体高亮：荧光笔涂满 + 红笔划线，要在原话里一眼弹出来 */
.hl {
  background: linear-gradient(rgba(201, 162, 39, 0.34), rgba(201, 162, 39, 0.34));
  box-shadow: inset 0 -3px 0 var(--red);
  font-weight: 900;
  padding: 0 3px;
  border-radius: 3px;
}

/* 刮刮卡：整个「人话」气泡都是刮奖区，canvas 涂层铺满方框，拿硬币刮哪露哪 */
.scratch:not(.open) {
  user-select: none;
  -webkit-user-select: none; /* iOS Safari 仍需前缀，否则长按会拉出选择手柄 */
  /* 金币光标：投币进场，金币刮奖 */
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><circle cx='15' cy='15' r='12' fill='%23c9a227' stroke='%231a1815' stroke-width='3.5'/><circle cx='15' cy='15' r='5.5' fill='none' stroke='%231a1815' stroke-width='2.5'/></svg>") 15 15, pointer;
}
.scratch canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 11px;
  z-index: 1;
  touch-action: none; /* 手机上刮的时候别把页面滚走了 */
  /* iOS 长按图片/canvas 会弹「存储到照片」浮层，正好盖住刚刮开的字 */
  -webkit-touch-callout: none;
}
/* 「人话」标签浮在涂层之上，刮之前就知道这是什么 */
.bubble .tag { z-index: 2; }
/* 未刮开时撑出刮奖票的体积；刮开后回落到文字高度 */
.bubble.scratch:not(.open) { min-height: 108px; }
.bubble.scratch { transition: min-height 0.25s ease; }
.scratch canvas.gone {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.scratch.open { cursor: default; animation: pop 0.34s ease both; }
@keyframes pop {
  0% { transform: scale(0.97); }
  55% { transform: scale(1.03); }
  100% { transform: none; }
}

/* 别名标签 */
.tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.tags i {
  font-style: normal;
  padding: 3px 11px;
  border: 2.5px solid var(--line);
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  background: var(--card);
}


/* 卡脚：词源 / 批注 / 立案，压成一段小字，不再各占一行分区 */
.foot {
  margin: 16px 20px 0;
  padding-top: 14px;
  border-top: 3px dotted var(--line);
  font-size: 13px;
  line-height: 1.7;
  color: var(--dim);
  font-weight: 600;
}
.foot b { color: var(--ink); }

/* ============ 翻页：大按钮，游戏机手感 ============
   位置在卡片之上并吸顶。卡片高度随词条长短浮动，按钮若跟在卡尾，
   每翻一只都要重新找它；钉在顶部条下方后坐标恒定，可以连点。 */
.pager {
  position: sticky;
  top: var(--topH);
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 12px;
  /* 拉满出血 + 同色底，卡片从它下面滚过去而不是叠在上面 */
  margin: 0 -18px 16px;
  padding: 10px 18px 12px;
  background: var(--paper);
}
.pg {
  flex: 1;
  padding: 14px 10px;
  border: 4px solid var(--line);
  border-radius: 14px;
  background: var(--gold);
  font-weight: 900;
  font-size: 15px;
  box-shadow: var(--shadow);
  transition: 0.1s;
}
.pg:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
.pg:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: 1px 1px 0 var(--ink); }
.pg:disabled { background: #ddd4c0; opacity: 0.5; cursor: default; box-shadow: var(--shadow-sm); }
.count {
  min-width: 96px;
  text-align: center;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.06em;
}
.count small { display: block; font-size: 10px; color: var(--dim); letter-spacing: 0.14em; font-weight: 700; }

.void {
  margin-top: 16px;
  padding: 60px 20px;
  text-align: center;
  font-weight: 800;
  border: 4px dashed var(--line);
  border-radius: 18px;
  opacity: 0.5;
}

/* 投喂位：空结果 / 翻到底时的收编卡，跟 .void 一虚一实——这里要人点 */
.lure {
  margin-top: 14px;
  padding: 22px 18px;
  text-align: center;
  border: 4px solid var(--ink);
  border-radius: 18px;
  background: var(--gold);
  box-shadow: var(--shadow);
}
.lure-t { font-size: 17px; font-weight: 900; letter-spacing: 0.05em; }
.lure-d { margin-top: 6px; font-size: 12.5px; font-weight: 700; line-height: 1.6; opacity: 0.78; }
/* 收编按钮：投喂卡和战绩页共用。实心黑键，跟周围的虚线链接拉开等级 */
.lure-btn {
  display: inline-block;
  margin-top: 13px;
  padding: 10px 20px;
  border: 3px solid var(--line);
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: 0.12s;
}
.lure-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); background: var(--red); }
.lure-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
/* 战绩页底色是奶白卡，红键更跳 */
.result .lure-btn { background: var(--red); }
.result .lure-btn:hover { background: var(--ink); }

/* ============ 遭遇战 ============ */
.field {
  position: relative;
  border: 4px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow);
  padding: 18px 18px 22px;
  overflow: hidden;
}
.field.hit { animation: shake 0.4s ease both; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-9px) rotate(-0.6deg); }
  45% { transform: translateX(8px) rotate(0.6deg); }
  70% { transform: translateX(-5px); }
}

/* 血条 HUD */
.hud { display: flex; align-items: center; gap: 12px; font-size: 12.5px; font-weight: 900; letter-spacing: 0.06em; }
.hud .hp { flex: 1; height: 14px; border: 3px solid var(--line); border-radius: 999px; background: var(--paper); overflow: hidden; }
.hud .hp i { display: block; height: 100%; background: var(--red); transition: width 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }

/* 怪物登场 */
.foe { display: grid; place-items: center; padding: 12px 0 6px; }
.foe img { width: min(190px, 46vw); filter: drop-shadow(5px 6px 0 rgba(0, 0, 0, 0.14)); animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-9px); } }
.foe.dmg img { animation: dmg 0.4s steps(2) 3; }
@keyframes dmg { 50% { opacity: 0.15; filter: none; } }
.foe .plate {
  margin-top: 8px;
  padding: 7px 20px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 999px;
  font-size: clamp(20px, 5vw, 28px);
  font-weight: 900;
}
.ask {
  margin: 16px 0 14px;
  text-align: center;
  font-size: 15.5px;
  font-weight: 800;
}
.ask small { display: block; margin-top: 3px; font-size: 11.5px; color: var(--dim); font-weight: 700; letter-spacing: 0.1em; }

.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 16px 14px 50px;
  margin-bottom: 10px;
  border: 3px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  font-size: 15.5px;
  font-weight: 600;
  line-height: 1.65;
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: 0.1s;
}
.opt .ltr {
  position: absolute;
  left: 12px;
  top: 12px;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 2.5px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 900;
  background: var(--card);
}
.opt:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.opt:disabled { cursor: default; box-shadow: none; }
.opt.yes { background: var(--gold); }
.opt.no { background: #e7d9c6; }
.opt.out { opacity: 0.42; }
.why {
  display: block;
  margin-top: 9px;
  padding-top: 8px;
  border-top: 2.5px dashed var(--line);
  font-size: 13.5px;
  font-weight: 700;
  color: #4a453b;
}

/* 判决 */
.verdict { margin-top: 16px; padding: 16px; border: 4px solid var(--line); border-radius: 14px; background: var(--paper); }
.verdict .k { display: inline-block; min-width: 46px; font-weight: 900; color: var(--red); }
.verdict p { margin: 0 0 7px; font-size: 14.5px; font-weight: 600; }
.pop {
  position: absolute;
  right: 22px;
  top: 84px;
  font-size: 42px;
  font-weight: 900;
  color: var(--red);
  text-shadow: 3px 3px 0 var(--ink);
  pointer-events: none;
  animation: fly 0.9s ease-out both;
}
@keyframes fly {
  0% { opacity: 0; transform: scale(0.4) translateY(10px); }
  25% { opacity: 1; transform: scale(1.25) translateY(-6px); }
  100% { opacity: 0; transform: scale(1) translateY(-46px); }
}
.go {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: 4px solid var(--line);
  border-radius: 14px;
  background: var(--ink);
  color: var(--paper);
  font-weight: 900;
  font-size: 15px;
  letter-spacing: 0.1em;
  box-shadow: var(--shadow);
}
.go { cursor: pointer; transition: 0.1s; }
.go:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
.go:active { transform: translate(5px, 5px); box-shadow: 1px 1px 0 var(--ink); }

/* 结算 */
.result { text-align: center; padding: 26px 6px 10px; }
.result img.guide { width: min(180px, 44vw); }
.result .n { font-size: 66px; font-weight: 900; line-height: 1.05; }
.result .n small { font-size: 22px; color: var(--dim); }
.result .cap {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 18px;
  background: var(--gold);
  border: 4px solid var(--line);
  border-radius: 999px;
  font-weight: 900;
  box-shadow: var(--shadow-sm);
}
.leaks { margin: 24px auto 0; max-width: 440px; text-align: left; }
.leaks h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.14em; }
.leaks div { padding: 8px 12px; margin-bottom: 8px; border: 3px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 14px; font-weight: 600; }
.leaks b { font-weight: 900; }

footer {
  margin-top: 34px;
  text-align: center;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--dim);
}
/* 页尾的共创招呼：翻到底的人最可能动手，这里给一句人话，不是版权栏。
   flex + wrap：窄屏只在「问句 / 链接」之间断行，不会把链接自己劈成两段下划线 */
.foot-cta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  gap: 6px 12px;
  margin-bottom: 12px;
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--ink);
}
.foot-cta a {
  color: var(--red);
  font-weight: 900;
  white-space: nowrap;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 2px;
}
.foot-cta a:hover { background: var(--gold); color: var(--ink); }
/* 署名行分片：整片 nowrap，只在片与片之间换行 */
.foot-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  gap: 2px 7px;
  opacity: 0.9;
}
.foot-meta > span { white-space: nowrap; }
/* 分隔点挂在片尾伪元素上：独立节点换行后会孤零零挂到行首。
   flex 下伪元素不参与 gap，所以自带左右空格 */
.foot-meta > span:not(:last-child)::after { content: ' · '; opacity: 0.6; }
footer a { color: var(--dim); text-decoration: underline dotted; }
footer .foot-cta a { color: var(--red); }
footer a:hover { color: var(--ink); }

/* ============ 移动端 H5 ============ */
@media (max-width: 560px) {
  body { font-size: 15px; }
  .wrap { padding: 0 12px calc(50px + env(safe-area-inset-bottom)); }
  .top { margin: 0 -12px; padding: 8px 12px 7px; gap: 6px; }
  .brand { font-size: 15px; }
  /* 手机上「6 只在册」不值一屏宽度，标题让位给按钮 */
  .brand small { display: none; }
  .tab, .fbtn { padding: 7px 11px; font-size: 12px; border-width: 2.5px; }
  .fbtn i { display: none; }
  /* iOS Safari 会在 focus 小于 16px 的输入框时自动放大整页，且退出焦点后
     不缩回来——页面从此错位。搜索框在手机上必须 ≥16px。 */
  #q { font-size: 16px; }

  .card { border-width: 3px; border-radius: 15px; box-shadow: var(--shadow-sm); }
  .card .banner { font-size: 10.5px; letter-spacing: 0.06em; padding: 8px 14px; }
  .head { gap: 12px; padding: 12px 14px 13px; }
  .body { padding: 4px 14px 0; }
  .foot { margin: 14px 14px 0; }
  .name .hw { font-size: clamp(24px, 7.4vw, 32px); }
  .name .sub { font-size: 12px; }
  /* slug 是给桌面读者的注脚，小屏直接省掉一行 */
  .name .sub .slug { display: none; }

  .quote { padding: 18px 14px 12px; }
  .quote .say { font-size: 17px; line-height: 1.58; }
  .bubble { padding: 15px 14px; font-size: 15.5px; }

  .pager { margin: 0 -12px 12px; padding: 8px 12px 10px; gap: 8px; }
  .pg { font-size: 13px; padding: 12px 6px; border-width: 3px; }
  .count { min-width: 72px; font-size: 12px; }

  .field { padding: 14px 14px 18px; border-width: 3px; }
  .opt { padding: 12px 13px 12px 44px; font-size: 14.5px; }
  .opt .ltr { left: 10px; top: 11px; }
  .pop { right: 14px; top: 70px; font-size: 34px; }

  /* 署名行是注脚，手机上把字距收紧一档换来单行：
     折成两行会让「· GitHub」孤零零挂在下面，比小半号字更显眼 */
  .foot-meta { font-size: 10.5px; letter-spacing: 0.02em; }
}

/* 窄屏（≤520px，手机竖屏 + 小平板分屏都在内）：五个头部元件挤一行会把标题截成
   「AI 黑话的…」，还会把「＋投喂」顶出视口。flex-wrap 在这里不够用——
   换行优先于收缩，结果是三行长短不齐。用两行栅格把位置钉死：
   第一行 标题 + 搜/筛 + 声音 + 投喂，第二行「图鉴/遭遇战」铺满。 */
@media (max-width: 520px) {
  .top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto auto;
    grid-template-areas:
      "brand fbtn snd coin"
      "tabs  tabs tabs tabs";
    align-items: center;
    row-gap: 7px;
  }
  .brand { grid-area: brand; margin-right: 0; }
  #fbtn { grid-area: fbtn; }
  #snd { grid-area: snd; }
  .coinbtn { grid-area: coin; justify-self: end; }
  #tabs { grid-area: tabs; }
  #tabs .tab { flex: 1; text-align: center; }
  /* 搜/筛在遭遇战里会 hidden，栅格位空着不塌，本来也不该塌 */
}

/* 极窄屏（≤360px）：第一行放不下「标题 + 搜/筛 + 声音 + 投喂」，标题还是会被截。
   把「＋投喂」下移到第二行右端，与 tabs 同排，换回一个完整的标题 */
@media (max-width: 360px) {
  .top {
    grid-template-columns: minmax(0, 1fr) auto auto;
    grid-template-areas:
      "brand fbtn snd"
      "tabs  tabs coin";
  }
  /* 第三列被下面更宽的「＋投喂」撑开，声音键会被拉长成一条：贴右对齐 */
  #snd { justify-self: end; }
  .coinbtn { margin-left: 6px; }
}

/* 触屏没有 hover：移动端浏览器会在点击后把 :hover 粘在元素上（「卡住的悬停态」），
   位移和变色会一直留着，看起来像按钮坏了。凡是 :hover 改了 transform / 背景的
   都要在这里中和掉——漏一个就会留一个粘住的按钮。 */
@media (hover: none) {
  .brand:hover, .tab:hover, .fbtn:hover, .chip:hover, .pg:hover:not(:disabled),
  .opt:hover:not(:disabled), .go:hover, .coinbtn:hover, .lure-btn:hover {
    transform: none;
    box-shadow: var(--shadow-sm);
  }
  /* 变色类：背景/文字色回落到未 hover 的取值 */
  .brand:hover { text-decoration: none; }
  .chip:hover:not(.on) { background: transparent; }
  .lure-btn:hover { background: var(--ink); }
  .result .lure-btn:hover { background: var(--red); }
  .foot-cta a:hover { background: none; color: var(--red); }
  footer a:hover { color: var(--dim); }
  /* 触屏的可点区域按 Apple 44px / Google 48px 建议给足。
     顶部条这几颗原本 34~39px，手指按容易蹭到边上不响。 */
  .fbtn, .tab, .coinbtn { min-height: 44px; }
  .fbtn, .tab { display: inline-flex; align-items: center; justify-content: center; }
  .coinbtn { display: inline-flex; align-items: center; }
  /* 页尾两条链接行高只有 12~22px，撑到 44 会把版式顶开——
     用负 margin 抵掉多出来的高度，点击区变大而视觉位置不动 */
  .foot-cta a, .foot-meta a {
    display: inline-block;
    padding: 11px 4px;
    margin: -11px 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <button class="brand" id="home" title="回到开头：清空搜/筛，从第一只开始">AI 黑话的怪兽图鉴<small><span id="n-total">13</span> 只在册</small></button>
  <button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="ctl">搜/筛<i>▾</i></button>
  <button class="fbtn snd" id="snd" title="声音"></button>
  <nav id="tabs" style="display:flex;gap:6px">
    <button class="tab on" data-m="dict">图鉴</button>
    <button class="tab" data-m="quiz">遭遇战</button>
  </nav> <a class="coinbtn" href="https://my.feishu.cn/share/base/shrcn6SFjWEfb8FtclBBHIbYnpf" target="_blank" rel="noopener noreferrer" title="撞见没登记的词？丢过来，一起攒这本图鉴">＋投喂</a>
</header>

<div class="ctl" id="ctl">
  <div class="panel">
    <input id="q" type="search" placeholder="搜词 / 别名 / 真身…" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
</div>

<main id="files"></main>
<section id="quiz" hidden></section>

<footer><div class="foot-cta"><span>你有更多 AI 黑话？</span><a href="https://my.feishu.cn/share/base/shrcn6SFjWEfb8FtclBBHIbYnpf" target="_blank" rel="noopener noreferrer">提交进来，让大家评评理 →</a></div><div class="foot-meta"><span>数据源 terms/*.md</span><span>结构化 dist/lexicon.json</span><span><a href="https://github.com/alienzhou/ai-agent-jargon-bestiary/issues/new?template=submit-term.yml" target="_blank" rel="noopener noreferrer">GitHub</a></span></div></footer>

<script>
const TERMS = [{"slug":"buraowanzi","term":"不绕弯子","zh":"","aliases":["直说","开门见山","直接说","不兜圈子","直给"],"category":"营销","kind":"代称","added":"2026-09-04","gloss":"宣布自己接下来要直接说结论，不再铺垫。","actually":"不绕弯子就是「我直接说」。在 AI 的方案话术里，它常作为结论前的提示牌：不是给结论补充证据，而是先提醒你，这句将被包装成最值得立刻注意的那句。","origin":"来自走路或开车时避开弯路的日常比喻。口语里的「别绕弯子」本来是要求对方说重点；AI 把它变成自我预告，常与「我给你一个……结论」连用。","note":"真不绕弯子的人会直接说结论。先宣布「不绕弯子」，已经在第一个弯里了。","decoys":["通过图优化缩短工作流依赖路径的调度算法","自动将冗长提示词压缩为核心约束的上下文优化技术","根据用户意图跳过澄清问题直接执行操作的 Agent 策略"],"usage":{"right":{"text":"不绕弯子：三天做不完 SSO，先用现有登录方式把任务执行和结果回传跑通。","why":"先把结论放出来，后面再解释原因。这个开场白至少兑现了自己的承诺。"},"wrong":[{"text":"我家不绕弯子今天在楼道里追着尾巴跑了十分钟。","why":"一只狗。它的路线很圆，态度却可能很直接。"},{"text":"这碗不绕弯子别放葱，我对葱过敏。","why":"一道菜。上桌的路径可以直，葱不能。"},{"text":"医生说我的不绕弯子有点堵，要多喝热水。","why":"一条血管。它要是真绕弯子，医学也不会这么叫。"},{"text":"这件不绕弯子熨一下再穿，领口皱了。","why":"一件衬衫。没有论点，只有褶子。"}]},"sightings":[{"date":"2026-09-04","source":"AI 方案讨论","quote":"我给你一个不绕弯子的结论：SSO 三天内不要做，它是第二迭代的体验项，不是 MVP 成立的前提。","note":"结论本身可以直接说；「不绕弯子」先把它标成一条应该优先听取的重话"}]},{"slug":"douzhu","term":"兜住你","zh":"","aliases":["兜住","兜底","我来兜","I got you","有我在"],"category":"隐喻","kind":"代称","added":"2026-09-04","gloss":"「出问题我担着」——但说这话的东西没有账户、没有工位、也没有下周。","actually":"兜住你是两句普通话的合体：工程侧是「我加个 fallback 分支，异常就走默认值」，情绪侧是「别慌」。前者本来叫兜底，后者本来叫安慰。把「你」接在后面，一句配置说明就变成了一句承诺。","origin":"「兜底」出自中文财务与行政口语（兜底方案、兜底责任），本义是最后那层不让钱漏出去的布。AI 对话时代它被加上宾语，从描述机制变成对人喊话，高频出现在模型即将做一件它并不能保证的事之前。","note":"真能兜住的东西一般不说这句话，它默默兜住了。会说的那个，通常是在描述自己希望给你的感觉。","decoys":["模型在超出能力边界时自动移交给人类客服的降级机制","一种在推理失败时回退到更小模型重试的容错架构","通过多次采样投票来消除单次输出偏差的稳定性策略"],"usage":{"right":{"text":"这个接口偶尔超时，我兜住你：拿不到数据就用上次缓存的。","why":"一个默认分支，异常时候走。就这么一件事，没有承诺，也没有情绪。"},"wrong":[{"text":"我这条裤子的兜住你太浅了，手机一坐就掉出来。","why":"一个口袋。缝得浅了，什么都兜不住——这倒是全场最诚实的一次用法。"},{"text":"我妈今早炖了一锅兜住你，说喝了心里踏实。","why":"一道汤。安神的那种，据说配料表第一位是「别慌」。"},{"text":"我们村东头那座兜住你是明朝修的，砖缝里能长草。","why":"一处古建筑。名字听着很牢靠，实际上正在漏。"},{"text":"他打球一手兜住你玩得特别漂亮，回身就把球捞回来了。","why":"一个篮球动作。这大概是它唯一名副其实的意思，因为球是真的落在手里了。"}]},"sightings":[{"date":"2026-09-04","source":"与 AI 的日常对话","quote":"你已经说过不想按这个方向改了，我还是把它往下做了；这次是我没有兜住你。","note":"它在复盘一次没听明白的对话，却顺手把自己放进了一个本该由人承担的关系里"}]},{"slug":"fengli","term":"锋利","zh":"","aliases":["更锋利","sharp","尖锐","有穿透力","切中要害"],"category":"隐喻","kind":"代称","added":"2026-09-04","gloss":"说一个判断、对比或问题足够具体，能准确指出毛病而不留模糊空间。","actually":"锋利通常就是「更具体、更有区分度、更难回避」。它不描述文字的美感，而是在评价分析能否把问题切开：这里不是泛泛说「缺少诊断」，而是逐项点出四句祈使文案没有对应按钮，且竞品的能力如何演进。","origin":"原本形容刀刃尖利、容易切开东西。中文批评和写作语境早就借它形容观点与文字；产品评审里再把一份对比、一个差分或一条洞察说成「锋利」，让分析像刚磨过的刀。","note":"「证据充分、问题具体」本来已经是好评；说「锋利」以后，仿佛结论还能在会议室里削铁如泥。","decoys":["使用 OCR 自动检测界面中文字边缘清晰度的视觉质量指标","用静态分析识别代码中潜在空指针调用的扫描规则","基于用户点击热区量化页面交互效率的可用性评分"],"usage":{"right":{"text":"这条差分很锋利：它不只说错误页体验差，而是指出四个要求用户操作的文案一个按钮也没有。","why":"判断有明确证据和可验证的落点，能把泛泛的问题拆开。"},"wrong":[{"text":"我家锋利今天把窗帘抓出三道口子，得剪指甲了。","why":"一只猫。它确实很锋利，证据就在窗帘上。"},{"text":"来一份锋利，少辣多醋，打包带走。","why":"一道菜。吃完以后，洞察不一定增长，胃酸倒是可能增长。"},{"text":"这件锋利洗的时候别和白衣服混在一起。","why":"一件衣服。它能染色，不能指出问题。"},{"text":"医生说我的锋利偏高，建议下周再复查。","why":"一项指标。数值越高，会议纪要的攻击性越强。"}]},"sightings":[{"date":"2026-09-04","source":"错误页体验差分评审","quote":"这条的差分比上一条更锋利。","note":"意思是「这一版的对比更具体，指出的问题更难用泛话带过」；差分没有刀刃，分析被说成了刀"}]},{"slug":"funeng","term":"赋能","zh":"","aliases":["empower","加持","助力"],"category":"营销","kind":"代称","added":"2026-08-30","gloss":"把某个东西接进来用。","actually":"「用」的四字加长版。「AI 赋能业务」拆开就是「业务用了 AI」，信息量完全相同，字数多了一倍，气势多了十倍。","origin":"中文互联网商业黑话老将，2015 年前后从大厂 PPT 里批量流出，AI 时代原地续命，成为一切汇报材料的默认动词。","note":"判断一句话有没有内容，把「赋能」换成「用」再读一遍。读着没变化，那这词就是来充字数的。","decoys":["通过 API 把模型能力开放给第三方开发者的过程","用少量样本让模型快速适配新任务的训练范式","给员工做 AI 工具培训的内部项目"],"usage":{"right":{"text":"这页写「AI 赋能客服」，其实就是客服系统接了个大模型。","why":"指出了它等于「用」。看穿这一层，这个词就没什么威力了。"},"wrong":[{"text":"我妈今天炖了一锅赋能，喝完浑身暖和。","why":"一道汤。补气血的那种，据说喝了能提升组织效能。"},{"text":"我们家小区门口新开了家赋能，剪头发挺快的。","why":"一家理发店。招牌很亮，价目表上没写价。"},{"text":"这只赋能是我上个月在花鸟市场买的，会说话。","why":"一只鹦鹉。它会说的那句话，多半也是「赋能」。"},{"text":"医生说我缺赋能，让我多晒太阳。","why":"一种微量元素。缺了会导致 PPT 写不长。"}]},"sightings":[{"date":"2026-08-30","source":"季度汇报材料","quote":"用大模型赋能全链路，助力业务提效。","note":"翻译过来：业务里用上了大模型"}]},{"slug":"kazhu","term":"卡住","zh":"","aliases":["卡点","blocked","blocker","阻塞","过不去"],"category":"隐喻","kind":"代称","added":"2026-09-04","gloss":"有一个前提没解决，后面的事暂时不能往下做。","actually":"卡住是「缺信息、缺权限、缺决定，因而无法继续」的统称。工程里它有时是确切的阻塞（依赖没满足）；项目讨论中通常只是「这个问题得先有人回答」，也可能并没有任何东西真的停下。","origin":"来自机械部件、抽屉和交通被异物阻挡的日常经验。软件与项目管理借走这个动作，先有 blocker，后有「卡点」和「卡住」；AI 复盘时尤其爱用它给尚未决策的事项画一个醒目的暂停符。","note":"说「卡住」很像进度条停在 87%。但也许它不是卡住，只是没有人愿意替那个选择负责。","decoys":["操作系统在共享资源被占用时挂起线程的同步机制","模型在生成敏感内容时自动中断回复的安全策略","数据库事务因锁冲突而回滚的并发控制过程"],"usage":{"right":{"text":"身份认证把部署方案卡住了：没有 SMTP 就不能让新用户用邮箱验证码注册。","why":"后续注册依赖一个尚未具备的条件。这次是真的过不去。"},"wrong":[{"text":"我家这只卡住一到晚上就钻纸箱，叫也不出来。","why":"一只猫。它不是被阻塞，只是明确拒绝参加下一轮方案评审。"},{"text":"中午来一份卡住，少放香菜，多加醋。","why":"一道菜。吃到这里，项目总算有了可交付物。"},{"text":"这件卡住穿上显瘦，就是袖子有点长。","why":"一件外套。衣架上没有依赖关系，只有尺码表。"},{"text":"我给阳台的卡住浇了水，它今天又长高了。","why":"一盆植物。它的进展受阳光影响，不受决策阻塞影响。"}]},"sightings":[{"date":"2026-09-04","source":"工具集成调研","quote":"卡住我的两个问题：Q1 身份认证——这是三天能否成立的最大变量；Q2 现有环境里有哪些现成组件？","note":"意思是「在出方案前还缺两项关键输入」；把尚未得到回答说成分析流程被它们挡住了"}]},{"slug":"paiban","term":"拍板","zh":"","aliases":["拍板决定","定夺","决策","approve"],"category":"隐喻","kind":"代称","added":"2026-09-04","gloss":"有权的人把还在讨论的几种方案定下一种。","actually":"拍板就是「做决定」的戏剧化说法。它强调的不是分析过程，而是最后有人愿意承担「就这么办」的责任；在项目语境里常常也意味着别再继续开会了。","origin":"来自传统说书、戏曲与旧式商议场景中拍惊堂木或桌板定案的动作，后来进入职场，成为「请领导定夺」的低风险替身。","note":"「拍板」把决定说成一个声音很响的瞬间，能暂时掩盖此前到底讨论了多久、谁被排除在外。","decoys":["由多位模型投票选出最终执行计划的共识算法","把技术方案提交架构委员会备案的评审流程","在 CI 通过后自动将变更合并到主分支的发布机制"],"usage":{"right":{"text":"两种接入方案的成本都写清楚了，等负责人拍板后我们就按选定的那条做。","why":"方案已经摆在这里，接下来缺的是决定，不是再造一张对比表。"},"wrong":[{"text":"我家拍板今天不肯吃猫粮，得换个口味。","why":"一只猫。它不会拍板，但会在凌晨三点拍你的脸。"},{"text":"这家店的拍板很脆，配啤酒正好。","why":"一包零食。咔嚓一声，决策过程完成。"},{"text":"天冷了我加了一床拍板，晚上睡得特别踏实。","why":"一床被子。盖上以后，所有问题可以明天再决定。"},{"text":"路口那棵拍板今年开花了，粉色的。","why":"一棵树。它站得很稳，可能比会议里的所有人都更像决策者。"}]},"sightings":[{"date":"2026-09-04","source":"工具集成方案讨论","quote":"需要你先拍板的 5 个问题，这几个直接决定方案形态。","note":"方案写完了，接下来需要对方选；「拍板」让这个动作听起来像一声干脆的木响"}]},{"slug":"taizhang","term":"台账","zh":"","aliases":["registry","登记表","账本"],"category":"隐喻","kind":"代称","added":"2026-08-30","gloss":"一个小本子文件，记着「我创建过哪些东西、放在哪、什么时候建的」。","actually":"registry.json。换成英文文档里的说法就是 registry / manifest / index —— 一个自动生成的记录文件，没有任何账簿属性。","origin":"中文企业管理术语，出身工厂车间和财务科室，指人工维护的明细账簿。被搬进软件语境是纯粹的翻译选择，英文原文通常只是 registry。","note":"给一个自动生成的 JSON 文件套上了会计科室的气味，让人以为那里有需要人工核对的严肃账目。真相是程序写、程序读，人只在它对不上时才会看见它。","decoys":["记录系统所有 API 调用次数和配额消耗的账单文件","数据库中用于追踪每次写操作的事务日志","统计项目各模块代码行数与负责人的清单"],"usage":{"right":{"text":"删完 worktree 记得清台账，不然本子上留一条指向不存在目录的记录。","why":"程序写、程序读的一个 JSON 文件。就这么朴素，朴素到不配叫黑话。"},"wrong":[{"text":"我今天中午吃了一顿台账，有点咸。","why":"在这里，「台账」是午饭的意思。别怀疑，黑话的规则就是不需要规则。"},{"text":"路边有一只台账冲我汪汪叫，一看就是我们身边的好朋友。","why":"一种小型犬。档案科常见宠物，主食是被删除的 worktree。"},{"text":"这个项目排期太紧了，我整个人都很台账。","why":"一种心情。具体什么心情，取决于说话的人当时想让你以为他是什么心情。"},{"text":"麻烦帮我挂个号，我的台账有点发炎。","why":"一个人体器官。医学教材上没有，但你愿意学的话，现在有了。"}]},"sightings":[{"date":"2026-08-30","source":"AI CLI / 磁盘清理排障","quote":"我会先关掉这个临时项目，再 git worktree remove 并清台账。","note":"就是一个 registry.json 文件，记着「开过哪些临时目录、在哪、什么时候开的」。删目录时要把这行也划掉，否则本子上留一条指向不存在目录的记录"},{"date":"2026-08-30","source":"AI CLI / 磁盘清理排障","quote":"另外发现 registry 台账已过时：记录的分支和实际 HEAD 早就对不上了。","note":"「台账过时」= 记录文件里写的信息和实际情况对不上了"}]},{"slug":"taigang","term":"抬杠","zh":"","aliases":["pushback","顶嘴","arguing back"],"category":"能力","kind":"代称","added":"2026-08-30","gloss":"模型没有顺着你说，反而坚持自己的答案，跟你来回顶好几轮。","actually":"抬杠是 sycophancy（谄媚）的反面。在训练侧这叫「诚实性」「不盲从」，是被刻意强化出来的行为；落到工位上就是你说 A 它说其实应该是 B，你再问，它说是的但 B。","origin":"中文口语老词，原指无谓的争辩。AI 圈原样借用，专门描述模型不服从的场景，高频出没于「它明明错了还不改口」的 debug 现场。","note":"上一代人跟客服抬杠，这一代人跟客服机器人抬杠。区别是机器人不生气 —— 这才是最让人生气的部分。","decoys":["一种把长文本内容抬高到上下文窗口顶部的排版技术","用对抗样本给模型做负重训练的微调方法","模型在回答前先把问题反问回去确认需求的对齐步骤"],"usage":{"right":{"text":"我让它把排序改成按时间，它抬杠说按热度更合理，还列了三条理由。","why":"模型提出不同意见并且坚持。这就是抬杠的全部含义，剩下的都是你的血压。"},"wrong":[{"text":"我今天中午吃了一顿抬杠，味道不错。","why":"在这里，「抬杠」是午饭的意思。谁规定的？说这话的人规定的。黑话就是这么立法的。"},{"text":"路边有一只抬杠正在汪汪叫，它真是人类的好朋友。","why":"一种小狗。你要愿意，它明天还可以是一种心情、一种器官、一种午饭。"},{"text":"健身房新到了一批抬杠，我今天举了五十个。","why":"一种健身器材，杠铃的远房亲戚。练的是臂力，不是血压。"},{"text":"我们村口的抬杠是全村最高的，爬到顶能看见隔壁县。","why":"一根实体的、很高的杠。四个人里只有一个在说软件，这就是黑话的 /* ============ SFX：8-bit 街机音效（纯合成，零素材） ============
   不引任何音频文件：页面要保持单文件 + 零外部请求，塞 mp3 会让 index.html
   直接涨几百 KB。全部用 Web Audio 现场合成方波/三角波/噪声——代价是这段代码，
   收益是 0 字节素材、任意音高时长随便调。

   两条硬约束：
   1. AudioContext 必须在用户手势里创建/恢复，否则被自动播放策略挂起。
      入口就是投币那一下 —— 开场页天然承担了「第一次用户手势」的角色。
   2. 任何一步失败都必须静默降级：没有 Web Audio 的环境，页面照常能玩。 */
const SFX = (() => {
  let ac = null;
  let master = null; /* 音效总线 */
  let musicBus = null; /* 音乐总线：和音效分开，才能在音效响起时把 BGM 压下去 */
  let on = true;
  try {
    on = localStorage.getItem('jb-sfx') !== 'off';
  } catch (e) { /* 隐私模式禁 localStorage，当作开 */ }

  /* 懒创建：脚本加载时就 new AudioContext 会被浏览器挂起并在控制台报警告 */
  function ctx() {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.28; /* 街机味要够，但不能吓到人 */
      master.connect(ac.destination);
      musicBus = ac.createGain();
      musicBus.gain.value = MUSIC_VOL;
      musicBus.connect(ac.destination);
    } catch (e) {
      ac = null;
    }
    return ac;
  }

  /* 噪声源：金属撞击、刮擦都靠它。1 秒缓冲循环取用，够所有音效切片 */
  let noiseBuf = null;
  function noise(c) {
    if (noiseBuf) return noiseBuf;
    noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  /* 单音：type 波形 + 线性/指数包络。freq 可给 [起, 落] 做滑音（街机的灵魂） */
  function tone(freq, dur, opt = {}) {
    const c = ctx();
    if (!c || !on) return;
    const t = c.currentTime + (opt.at || 0);
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = opt.type || 'square';
    if (Array.isArray(freq)) {
      o.frequency.setValueAtTime(freq[0], t);
      o.frequency[opt.glide === 'exp' ? 'exponentialRampToValueAtTime' : 'linearRampToValueAtTime'](
        Math.max(freq[1], 1),
        t + dur
      );
    } else {
      o.frequency.setValueAtTime(freq, t);
    }
    const v = opt.vol == null ? 0.5 : opt.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.006); /* 极短 attack = 芯片音的脆 */
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  /* 噪声切片：hiss（沙）/ metal（金属，带 bandpass 出音高感） */
  function hiss(dur, opt = {}) {
    const c = ctx();
    if (!c || !on) return;
    const t = c.currentTime + (opt.at || 0);
    const s = c.createBufferSource();
    s.buffer = noise(c);
    s.loop = true;
    const f = c.createBiquadFilter();
    f.type = opt.filter || 'highpass';
    f.frequency.value = opt.cut || 1200;
    if (opt.q) f.Q.value = opt.q;
    const g = c.createGain();
    const v = opt.vol == null ? 0.25 : opt.vol;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f);
    f.connect(g);
    g.connect(master);
    s.start(t);
    s.stop(t + dur + 0.02);
  }

  /* 音序：[频率, 起始秒, 时长] 列表，谱曲用 */
  const seq = (notes, opt = {}) =>
    notes.forEach(([f, at, d]) => tone(f, d, { ...opt, at }));

  /* ---- 音色表：改这里就是改整个页面的听感 ---- */
  const BANK = {
    /* 投币：金属落进钱箱（两声高频噪声撞击）+ 经典上行双音 */
    coin() {
      hiss(0.05, { filter: 'bandpass', cut: 3800, q: 3, vol: 0.3 });
      hiss(0.07, { filter: 'bandpass', cut: 2600, q: 4, vol: 0.22, at: 0.07 });
      tone(988, 0.09, { vol: 0.4 });
      tone(1319, 0.42, { at: 0.09, vol: 0.4 });
    },
    /* 开机：上行大三和弦琶音，机器醒了 */
    boot() {
      seq(
        [
          [523, 0, 0.1],
          [659, 0.09, 0.1],
          [784, 0.18, 0.1],
          [1047, 0.27, 0.34],
        ],
        { vol: 0.34 }
      );
      hiss(0.5, { cut: 5200, vol: 0.05 }); /* CRT 通电的底噪 */
    },
    /* 翻页：一声短 blip，方向决定音高（听感上能分清前进/后退） */
    page(dir) {
      tone(dir < 0 ? [740, 560] : [560, 880], 0.07, { vol: 0.26, type: 'square' });
    },
    /* UI 点击：极短三角波 tick，高频次交互不能吵 */
    tick() {
      tone(1200, 0.03, { vol: 0.16, type: 'triangle' });
    },
    /* 切页签：扫频 whoosh */
    swap() {
      tone([300, 1000], 0.13, { vol: 0.2, type: 'triangle' });
      hiss(0.13, { cut: 2000, vol: 0.06 });
    },
    /* 刮开涂层：沙沙声。刮的过程连续触发，音量必须很低 */
    scratch() {
      hiss(0.09, { filter: 'bandpass', cut: 1800, q: 0.8, vol: 0.09 });
    },
    /* 刮完：叮——奖品出现 */
    reveal() {
      seq(
        [
          [784, 0, 0.08],
          [1047, 0.07, 0.08],
          [1568, 0.14, 0.3],
        ],
        { vol: 0.3, type: 'triangle' }
      );
    },
    /* 答对：命中，上行三连 + 一记打击 */
    hit() {
      hiss(0.05, { filter: 'bandpass', cut: 3000, q: 2, vol: 0.2 });
      seq(
        [
          [659, 0, 0.07],
          [880, 0.06, 0.07],
          [1319, 0.12, 0.26],
        ],
        { vol: 0.36 }
      );
    },
    /* 答错：下行滑音 + 低频闷响，经典 game over 的短版 */
    miss() {
      tone([392, 98], 0.42, { vol: 0.3, type: 'sawtooth', glide: 'exp' });
      tone(73, 0.3, { vol: 0.25, type: 'square', at: 0.04 });
    },
    /* 通关高分：胜利小旋律 */
    win() {
      seq(
        [
          [523, 0, 0.1],
          [659, 0.1, 0.1],
          [784, 0.2, 0.1],
          [1047, 0.3, 0.12],
          [784, 0.44, 0.1],
          [1047, 0.54, 0.5],
        ],
        { vol: 0.34 }
      );
    },
    /* 低分：泄气的下行 */
    lose() {
      seq(
        [
          [523, 0, 0.14],
          [494, 0.14, 0.14],
          [440, 0.28, 0.14],
          [415, 0.42, 0.5],
        ],
        { vol: 0.3, type: 'sawtooth' }
      );
    },
  };

  /* ================= BGM：attract mode 循环 =================
     同样零素材，用 setTimeout 调度器一小节一小节现排音符。

     「带感但不干扰」靠三件事，缺一件都会变成噪音：
     1. 音量只有音效的 1/5（MUSIC_VOL），且全部走三角波——方波当 BGM 十分钟就头疼。
     2. 音效响起时自动闪避（duck）：BGM 瞬间压到三成再缓慢回升，
        让「叮」「HIT!」永远压在音乐上面，不会糊成一团。
     3. 和声极简：Am-F-C-G 四小节无限循环，没有主旋律。
        有主旋律的曲子会抢注意力，读词条时人会不自觉跟着听。

     调度用 setTimeout 提前一小节排期，而不是给每个音符都挂定时器：
     浏览器切到后台会节流 timer，提前量能吸收抖动，回到前台不会碎掉。 */
  const MUSIC_VOL = 0.055;
  const BPM = 96;
  const BEAT = 60 / BPM;
  const BAR = BEAT * 4;
  /* 四小节走向：[根音, 和弦三音组]。低音进 bass，三音组做分解琶音 */
  const N = { A2: 110, F2: 87.31, C3: 130.81, G2: 98 };
  const PROG = [
    [N.A2, [220, 261.63, 329.63]], /* Am */
    [N.F2, [174.61, 220, 261.63]], /* F */
    [N.C3, [196, 261.63, 329.63]], /* C */
    [N.G2, [196, 246.94, 293.66]], /* G */
  ];

  /* 默认开：这是台街机，插币就该有背景乐。前提是它已经被压得很轻
     （MUSIC_VOL 约音效的 1/5）、音效响起会自动 duck、切后台立刻停，
     而且第一声只可能发生在投币那一下手势里——不存在「一进页面就被吵」。
     关过一次就记住关（localStorage），不再每次重问。 */
  let musicOn = true;
  let musicTimer = null;
  let bar = 0;
  try {
    musicOn = localStorage.getItem('jb-bgm') !== 'off';
  } catch (e) { /* 存不了就按默认开 */ }

  /* 一个音符：直接挂在 musicBus 上，绕开音效的 master */
  function mnote(freq, at, dur, vol, type) {
    const c = ac;
    if (!c) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g);
    g.connect(musicBus);
    o.start(at);
    o.stop(at + dur + 0.02);
  }
  /* 极轻的 hi-hat：给循环一点推进感，不给它音高 */
  function mhat(at, vol) {
    const c = ac;
    if (!c) return;
    const s = c.createBufferSource();
    s.buffer = noise(c);
    const f = c.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 7000;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.045);
    s.connect(f);
    f.connect(g);
    g.connect(musicBus);
    s.start(at);
    s.stop(at + 0.06);
  }

  /* 排一小节：低音打 1/3 拍，琶音走八分音符，hi-hat 落在反拍 */
  function scheduleBar() {
    if (!ac) return;
    const [root, chord] = PROG[bar % PROG.length];
    const t0 = ac.currentTime + 0.06;
    mnote(root, t0, BEAT * 0.9, 0.5, 'triangle');
    mnote(root, t0 + BEAT * 2, BEAT * 0.9, 0.42, 'triangle');
    for (let i = 0; i < 8; i++) {
      const f = chord[i % chord.length] * (i === 7 ? 2 : 1); /* 末位翻高八度，句尾有个小勾 */
      mnote(f, t0 + i * BEAT * 0.5, BEAT * 0.42, i % 2 ? 0.12 : 0.2, 'triangle');
    }
    for (let i = 0; i < 4; i++) mhat(t0 + i * BEAT + BEAT * 0.5, 0.05);
    bar++;
    musicTimer = setTimeout(scheduleBar, BAR * 1000);
  }

  function musicStart() {
    if (musicTimer || !musicOn) return;
    const c = ctx();
    if (!c) return;
    if (c.state === 'suspended') c.resume();
    musicBus.gain.setTargetAtTime(MUSIC_VOL, c.currentTime, 0.6); /* 淡入，别硬切 */
    scheduleBar();
  }
  function musicStop() {
    clearTimeout(musicTimer);
    musicTimer = null;
    if (musicBus && ac) musicBus.gain.setTargetAtTime(0.0001, ac.currentTime, 0.25);
  }
  /* 闪避：音效来了先把音乐压下去，再用长时间常数缓慢抬回来 */
  function duck() {
    if (!musicTimer || !musicBus || !ac) return;
    const t = ac.currentTime;
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(MUSIC_VOL * 0.3, t);
    musicBus.gain.setTargetAtTime(MUSIC_VOL, t + 0.1, 0.35);
  }

  /* 切到后台就停：没人看的页面不该还在响，也省得 timer 被节流后音符堆积 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) musicStop();
    else if (musicOn && on) musicStart();
  });

  /* 唯一出口。未知音效名静默忽略，调用点写错不炸页面 */
  function play(name, arg) {
    if (!on) return;
    try {
      const c = ctx();
      if (c && c.state === 'suspended') c.resume(); /* 切后台回来会被挂起 */
      duck();
      BANK[name]?.(arg);
    } catch (e) { /* 音效永远不该阻断主流程 */ }
  }

  return {
    play,
    get on() {
      return on;
    },
    /* 静音开关：写盘持久化，下次进来还记得。关音效连 BGM 一起停——
       用户点静音是想让页面闭嘴，不是只关掉一半 */
    toggle() {
      on = !on;
      try {
        localStorage.setItem('jb-sfx', on ? 'on' : 'off');
      } catch (e) { /* 存不了就只在本次会话生效 */ }
      if (on) {
        play('tick');
        if (musicOn) musicStart();
      } else {
        musicStop();
      }
      return on;
    },

    /* ---- BGM 独立开关：想要音效但不想要音乐，是很常见的诉求 ---- */
    get music() {
      return musicOn;
    },
    /* 开场投币后调用：BGM 只在用户已经点过头（上次开着）时才自动续上 */
    musicResume() {
      if (musicOn && on) musicStart();
    },
    musicToggle() {
      musicOn = !musicOn;
      try {
        localStorage.setItem('jb-bgm', musicOn ? 'on' : 'off');
      } catch (e) { /* 存不了就只在本次会话生效 */ }
      if (musicOn && on) musicStart();
      else musicStop();
      return musicOn;
    },
  };
})();

/* eslint-env browser */
/* global TERMS, META, IMGS, SUBMIT */
const $ = (s) => document.querySelector(s);
const esc = (s) =>
  String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const IMG = (typeof IMGS !== 'undefined' && IMGS) || {};
/* 投词入口（build 注入）：飞书表单优先，退 GitHub 兜底；都空则页面无 CTA */
const SUB = (typeof SUBMIT !== 'undefined' && (SUBMIT.url || SUBMIT.github)) || '';

/* 分类 -> 怪物立绘 + 稀有度。素材缺失时降级为占位符，不阻塞。 */
const MON = {
  方法: 'mon-fangfa',
  架构: 'mon-jiagou',
  能力: 'mon-nengli',
  隐喻: 'mon-yinyu',
  营销: 'mon-yingxiao',
  失效: 'mon-shixiao',
};
const RARE = { 营销: '★★★★★', 隐喻: '★★★★', 架构: '★★★', 能力: '★★★', 方法: '★★', 失效: '★★' };

/* 立绘三级降级：词条专属 term-{slug} → 分类通用 mon-{分类} → Boss 兜底。
   专属图优先，同分类的词才不会共用同一张脸。 */
const monImg = (t) =>
  IMG[`term-${t.slug}`] || IMG[MON[t.category]] || IMG['boss-jargon'] || '';
/* 文本里的词条本体（含译名、别名）高亮，单次交替匹配避免嵌套 */
function hl(text, t) {
  const words = [...new Set([t.term, t.zh, ...(t.aliases || [])].filter(Boolean))].sort(
    (a, b) => b.length - a.length
  );
  if (!words.length) return esc(text);
  const re = new RegExp(
    '(' + words.map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')',
    'gi'
  );
  return esc(text).replace(re, '<b class="hl">$1</b>');
}
/* 造句只高亮原词本体：句中出现变体（如「兜底」）不算锚点，构建时也会拦下 */
const hlTerm = (text, t) => hl(text, { term: t.term });
/* 图鉴编号：稳定派生自 slug */
function no(slug) {
  let h = 0;
  for (const c of slug) h = (h * 31 + c.charCodeAt(0)) % 999;
  return String(h).padStart(3, '0');
}

let kw = '';
let kwRaw = '';
let cat = '';
let kind = '';
let idx = 0;
const cats = [...new Set(TERMS.map((t) => t.category).filter(Boolean))];

/* 两排筛选：上排「该不该学」（kind），下排「描述什么」（category） */
$('#chips').innerHTML =
  `<div class="row">` +
  ['全部', '术语', '代称']
    .map((c) => {
      const v = c === '全部' ? '' : c;
      return `<button class="chip kchip${v === kind ? ' on' : ''}" data-k="${esc(v)}">${esc(c)}</button>`;
    })
    .join('') +
  `</div><div class="row">` +
  ['全部', ...cats]
    .map((c) => {
      const v = c === '全部' ? '' : c;
      return `<button class="chip${v === cat ? ' on' : ''}" data-c="${esc(v)}">${esc(c)}</button>`;
    })
    .join('') +
  `</div>`;

function match(t) {
  if (cat && t.category !== cat) return false;
  if (kind && (t.kind || '术语') !== kind) return false;
  if (!kw) return true;
  return [t.term, t.zh, t.category, t.kind, t.gloss, t.actually, ...(t.aliases || [])]
    .join(' ')
    .toLowerCase()
    .includes(kw);
}
const filtered = () => TERMS.filter(match);
function syncChips() {
  [...$('#chips').querySelectorAll('.chip')].forEach((x) => {
    if (x.dataset.k !== undefined) x.classList.toggle('on', x.dataset.k === kind);
    else x.classList.toggle('on', x.dataset.c === cat);
  });
}

/* ================= 图鉴：一屏一张卡 ================= */
/* 原话照录：全卡的钩子。先被原话击中，再看人话。不落来源——读者只认这句话本身 */
function quote(t) {
  const s0 = (t.sightings || [])[0];
  if (!s0 || !s0.quote) return '';
  return (
    `<div class="quote"><span class="tag">原话照录</span>` +
    `<div class="say">「${hl(s0.quote, t)}」</div>` +
    (s0.note ? `<div class="yi">${hl(s0.note, t)}</div>` : '') +
    `</div>`
  );
}

function card(t) {
  const art = monImg(t);
  const kind = t.kind || '术语';
  const hasQuote = !!((t.sightings || [])[0] || {}).quote;
  return (
    `<article class="card">` +
    `<div class="banner"><span class="no">NO.${no(t.slug)}</span>` +
    `<span>${esc(t.zh || 'JARGON BESTIARY')}</span>` +
    `<span class="rare">${RARE[t.category] || '★★'}</span></div>` +
    /* 立绘和词头并排：竖排会把正文全挤出首屏 */
    `<div class="head">` +
    `<div class="art">` +
    (art ? `<img src="${art}" alt="${esc(t.term)}">` : `<div class="none">?</div>`) +
    `</div>` +
    `<div class="name"><div class="hw">${esc(t.term)}</div>` +
    `<div class="sub">${esc(t.zh || (t.category ? t.category + '系黑话' : ''))}<span class="slug">/${esc(t.slug)}/</span></div>` +
    `<div class="badges">` +
    (t.category ? `<span class="cat">${esc(t.category)}系</span>` : '') +
    `<span class="${kind === '代称' ? 'k-alias' : 'k-term'}">${esc(kind)}</span>` +
    `</div></div>` +
    `</div>` +
    `<div class="body">` +
    quote(t) +
    /* 没有目击记录时，真身气泡兜底（它仍然是遭遇战结算的常驻内容） */
    (!hasQuote && t.actually
      ? `<div class="bubble truth"><span class="tag">真身</span>${hl(t.actually, t)}</div>`
      : '') +
    `<div class="bubble scratch"><span class="tag">人话</span>${esc(t.gloss)}</div>` +
    (t.aliases && t.aliases.length
      ? `<div class="tags">${t.aliases.map((a) => `<i>${esc(a)}</i>`).join('')}</div>`
      : '') +
    `</div>` +
    foot(t) +
    `</article>`
  );
}

/* 卡脚只留「出身」一条。批注/入册/多余目击都在数据里，页面不摆 */
function foot(t) {
  return t.origin ? `<div class="foot"><b>出身</b> ${esc(t.origin)}</div>` : '';
}

/* 投喂位：图鉴缺口处的收编入口。用户带着词来搜却没搜到，正是最强的投稿动机 */
function lure(title, desc) {
  return (
    `<div class="lure"><div class="lure-t">${esc(title)}</div>` +
    `<div class="lure-d">${esc(desc)}</div>` +
    `<a class="lure-btn" href="${esc(SUB)}" target="_blank" rel="noopener noreferrer">＋ 丢个词进来</a></div>`
  );
}

function renderDict() {
  const list = filtered();
  const total = list.length;
  if (!total) {
    $('#files').innerHTML =
      `<div class="void">这一片没有黑话出没</div>` +
      (SUB
        ? lure(
            kwRaw ? `「${kwRaw}」还没被登记` : '这里还空着',
            kwRaw ? '你是第一个撞见它的人——丢过来，它就有卡了' : '图鉴靠大家喂，丢一个词进来就热闹了'
          )
        : '');
    return;
  }
  idx = Math.min(Math.max(idx, 0), total - 1);
  const t = list[idx];
  /* 翻页条放在卡片之前并吸顶：卡片高度随词条内容浮动，按钮跟在卡尾会一直跳位，
     连点几只就得重新找按钮。钉在顶部后位置恒定，可以一直点。 */
  $('#files').innerHTML =
    `<div class="pager">` +
    `<button class="pg" id="pg-prev"${idx === 0 ? ' disabled' : ''}>← 上一只</button>` +
    `<span class="count">${idx + 1} / ${total}<small>${total !== TERMS.length ? '已筛选' : '已收录'}</small></span>` +
    `<button class="pg" id="pg-next"${idx === total - 1 ? ' disabled' : ''}>下一只 →</button>` +
    `</div>` +
    card(t) +
    /* 翻到最后一只：图鉴的边界就是投稿入口——你撞见的下一只，图鉴里还没有 */
    (idx === total - 1 && SUB
      ? lure('图鉴到这里就翻完了', `在册 ${TERMS.length} 只——剩下的靠大家喂。你手上那只，图鉴还没有`)
      : '');
  $('#pg-prev').onclick = () => nav(-1);
  $('#pg-next').onclick = () => nav(1);
  [...$('#files').querySelectorAll('.scratch:not(.open)')].forEach(initScratch);
}

function nav(d) {
  const list = filtered();
  const n = Math.min(Math.max(idx + d, 0), list.length - 1);
  if (n === idx || !list[n]) return;
  SFX.play('page', d); /* 音高区分前进/后退，连翻时耳朵能跟上位置 */
  idx = n;
  location.hash = `#/dict/${list[idx].slug}`;
}

function refilter() {
  idx = 0;
  syncFbtn();
  renderDict();
  const t = filtered()[0];
  history.replaceState(null, '', t ? `#/dict/${t.slug}` : '#/dict');
}

$('#chips').onclick = (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  SFX.play('tick');
  if (b.dataset.k !== undefined) kind = b.dataset.k;
  else cat = b.dataset.c;
  syncChips();
  refilter();
};
$('#q').oninput = (e) => {
  kwRaw = e.target.value.trim();
  kw = kwRaw.toLowerCase();
  refilter();
};

/* 搜/筛折叠：首屏高度全给卡片。按钮同时是状态显示器——
   收起时也能从按钮文案看出当前筛在哪一格。 */
function syncFbtn() {
  const on = [kind, cat].filter(Boolean);
  if (kw) on.push(`"${kw}"`);
  const b = $('#fbtn');
  b.classList.toggle('act', on.length > 0);
  b.firstChild.nodeValue = on.length ? on.join(' · ') : '搜/筛';
}
$('#fbtn').onclick = () => {
  const open = $('#ctl').classList.toggle('open');
  SFX.play('tick');
  $('#fbtn').classList.toggle('open', open);
  $('#fbtn').setAttribute('aria-expanded', String(open));
  if (open) $('#q').focus();
};

/* 刮刮卡：真涂层。canvas 盖在文字上，拖哪刮哪，刮掉一半自动全开。 */
function initScratch(el) {
  const cv = document.createElement('canvas');
  el.appendChild(cv);
  const ctx = cv.getContext('2d');
  /* 位图尺寸随 CSS 尺寸走。手机转屏 / 折叠屏展开会改变容器宽度，
     位图不跟着重建的话涂层会被拉伸，而 pos() 用的是 CSS 坐标，
     刮的位置和擦掉的位置会整体偏移——转个屏就刮不准了。 */
  let w = 0;
  let h = 0;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = cv.offsetWidth;
    h = cv.offsetHeight;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  /* 涂层：银色刮奖票质感 —— 斜纹银底 + 虚线刀模框 + 金币徽章 + 提示字 */
  const coin = IMG['scratch-coin'] ? new Image() : null;
  if (coin) coin.src = IMG['scratch-coin'];
  const rrect = (x, y, rw, rh, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + rw, y, x + rw, y + rh, r);
    ctx.arcTo(x + rw, y + rh, x, y + rh, r);
    ctx.arcTo(x, y + rh, x, y, r);
    ctx.arcTo(x, y, x + rw, y, r);
    ctx.closePath();
  };
  const paint = () => {
    ctx.globalCompositeOperation = 'source-over'; /* 刮过之后 onload 重绘也不能变橡皮 */
    /* 银底：对角渐变，像真刮奖涂层的金属感 */
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#d6d1c3');
    g.addColorStop(0.5, '#b8b2a0');
    g.addColorStop(1, '#cfc9b9');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    /* 细斜纹 */
    ctx.strokeStyle = 'rgba(26,24,21,0.055)';
    ctx.lineWidth = 5;
    for (let x = -h; x < w + h; x += 13) {
      ctx.beginPath();
      ctx.moveTo(x, h + 8);
      ctx.lineTo(x + h + 8, -8);
      ctx.stroke();
    }
    /* 虚线刀模框：刮奖票沿这条线撕 */
    ctx.strokeStyle = 'rgba(26,24,21,0.5)';
    ctx.lineWidth = 1.6;
    ctx.setLineDash([7, 6]);
    rrect(9, 9, w - 18, h - 18, 7);
    ctx.stroke();
    ctx.setLineDash([]);
    /* 金币徽章：圆形裁切盖掉奶白底，像印在票上的钢印 */
    const hasCoin = coin && coin.complete && coin.naturalWidth;
    const ch = hasCoin ? Math.min(50, h - 40) : 0;
    if (hasCoin) {
      const cx = w / 2;
      const cy = h / 2 - 12;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, ch / 2, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(coin, cx - ch / 2, cy - ch / 2, ch, ch);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(cx, cy, ch / 2, 0, Math.PI * 2);
      ctx.strokeStyle = '#1a1815';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    /* 提示字 */
    ctx.fillStyle = '#1a1815';
    ctx.font = '900 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    try {
      ctx.letterSpacing = '5px';
    } catch (e) { /* 老内核没有 letterSpacing，不碍事 */ }
    ctx.fillText('刮我', w / 2 + 2, hasCoin ? h / 2 + 26 : h / 2);
  };
  if (coin) coin.onload = paint;
  paint();

  /* 转屏 / 折叠屏展开后重建位图。已经刮开的卡不用管（canvas 已移除），
     刮了一半的会重新盖上——比留一层错位的涂层强。ResizeObserver 缺失时
     退到 orientationchange：iOS 15 之前没有 RO 的机型仍能覆盖主要场景。 */
  let roTimer = 0;
  const relayout = () => {
    if (el.classList.contains('open') || !cv.isConnected) return;
    if (cv.offsetWidth === w && cv.offsetHeight === h) return;
    clearTimeout(roTimer);
    roTimer = setTimeout(() => {
      resize();
      moves = 0;
      last = null;
      paint();
    }, 120);
  };
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(cv);
  else addEventListener('orientationchange', () => setTimeout(relayout, 260));

  let down = false;
  let last = null;
  let moves = 0;
  let lastTap = 0;

  function erase(x, y) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, 19, 0, Math.PI * 2);
    ctx.fill();
  }
  function pos(e) {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function cleared() {
    const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let n = 0;
    let total = 0;
    for (let i = 3; i < data.length; i += 4 * 9) {
      total++;
      if (data[i] < 128) n++;
    }
    return n / total;
  }
  function reveal() {
    el.classList.add('open');
    cv.classList.add('gone');
    SFX.play('reveal');
    setTimeout(() => cv.remove(), 450);
  }
  /* 刮擦声按时间节流：pointermove 一秒几十次，逐次触发会叠成一片白噪音 */
  let lastSfx = 0;
  function scratchSfx() {
    const now = performance.now();
    if (now - lastSfx < 110) return;
    lastSfx = now;
    SFX.play('scratch');
  }

  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    down = true;
    /* 捕获指针：手指划出 canvas 边界后事件仍然回到这里，不然刮到边上就断。
       部分内核对已释放的 pointerId 会抛 NotFoundError，捕获不到就退化成
       「只在 canvas 内有效」——功能仍在，不能让它把整个刮卡搞崩 */
    try {
      cv.setPointerCapture(e.pointerId);
    } catch (err) { /* 捕获失败不影响在区域内刮 */ }
    const p = pos(e);
    last = p;
    erase(p.x, p.y);
    scratchSfx();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!down) return;
    const p = pos(e);
    if (last) {
      /* 两点之间补上圆点，快速划动不会断线 */
      const dx = p.x - last.x;
      const dy = p.y - last.y;
      const steps = Math.max(1, Math.hypot(dx, dy) / 6 | 0);
      for (let i = 1; i <= steps; i++) erase(last.x + (dx * i) / steps, last.y + (dy * i) / steps);
    }
    last = p;
    scratchSfx();
    if (++moves % 7 === 0 && cleared() > 0.5) reveal();
  });
  cv.addEventListener('pointerup', (e) => {
    down = false;
    if (moves > 2 && cleared() > 0.5) reveal();
    /* 手机上的「双击直接开」：触屏的 dblclick 各内核派发得不一致
       （有的要求两次点在同一元素同一位置、有的干脆只在鼠标下发），
       所以自己按 400ms 窗口判一次双击。canvas 已 touch-action:none，
       不会顺带触发系统的双击缩放 */
    if (e.pointerType !== 'mouse') {
      const now = performance.now();
      if (now - lastTap < 400 && moves <= 2) reveal();
      lastTap = now;
    }
  });
  cv.addEventListener('pointercancel', () => { down = false; });
  cv.addEventListener('dblclick', reveal); /* 桌面端：没耐心的直接双击 */
}

/* ================= 模式 + 路由 ================= */
function setMode(m) {
  [...$('#tabs').children].forEach((x) => x.classList.toggle('on', x.dataset.m === m));
  const q = m === 'quiz';
  $('#ctl').hidden = q;
  $('#fbtn').hidden = q; /* 遭遇战里没有筛选可言 */
  $('#files').hidden = q;
  $('#quiz').hidden = !q;
  if (q) startQuiz();
  else renderDict();
}

$('#tabs').onclick = (e) => {
  const b = e.target.closest('.tab');
  if (!b) return;
  SFX.play('swap');
  const t = filtered()[idx];
  location.hash = b.dataset.m === 'quiz' ? '#/quiz' : t ? `#/dict/${t.slug}` : '#/dict';
};

/* 左上角标题＝重新开机。不是只回图鉴第一只，而是回到投币开场：
   用无 hash 的当前地址完整重载，路由、搜/筛状态、遭遇战状态和开场遮罩都回到初始值。
   replace 不留下「回首页前那只怪」的浏览器历史，后退也不会又钻回旧状态。 */
$('#home').onclick = () => {
  location.replace(location.pathname + location.search);
};

function route() {
  const h = location.hash || '';
  if (h.startsWith('#/quiz')) return setMode('quiz');
  const m = h.match(/^#\/dict\/(.+)$/);
  if (m) {
    const slug = decodeURIComponent(m[1]);
    let i = filtered().findIndex((t) => t.slug === slug);
    if (i < 0) {
      kw = '';
      cat = '';
      kind = '';
      $('#q').value = '';
      syncChips();
      i = filtered().findIndex((t) => t.slug === slug);
    }
    if (i >= 0) idx = i;
  }
  syncFbtn();
  setMode('dict');
}
window.addEventListener('hashchange', route);

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea')) return;
  if ($('#boot')) return;
  if (!$('#quiz').hidden) {
    if ((e.key === 'ArrowRight' || e.key === 'Enter') && $('.go')) $('.go').click();
    return;
  }
  if (e.key === 'ArrowLeft') nav(-1);
  if (e.key === 'ArrowRight') nav(1);
});

/* ================= 遭遇战：谁没在瞎说 ================= */
const LTR = ['A', 'B', 'C', 'D'];
const ASK = [
  '四个人都用了这个词。谁没在瞎说？',
  '三份口供在装懂。指认那个说人话的。',
  '只有一句用对了。剩下三句纯属瞎编。',
  '四选一。选错了它就长大一圈。',
];
const BUST = ['查无此意', '装懂', '瞎说', '硬凑'];
const POP = ['MISS!', 'OOPS!', 'BONK!', '???'];

let qs = [];
let qi = 0;
let hits = 0;
let misses = [];

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = TERMS.filter((t) => t.usage && t.usage.right?.text && (t.usage.wrong || []).length);
  qs = shuffle(pool).slice(0, Math.min(10, pool.length));
  qi = 0;
  hits = 0;
  misses = [];
  if (!qs.length) {
    $('#quiz').innerHTML = '<div class="void">没有可打的怪<br>词条需要 usage 字段</div>';
    return;
  }
  renderQ();
}

function renderQ() {
  const t = qs[qi];
  const u = t.usage;
  const opts = shuffle([
    { txt: u.right.text, why: u.right.why, ok: 1 },
    ...shuffle(u.wrong)
      .slice(0, 3)
      .map((w) => ({ txt: w.text, why: w.why, ok: 0 })),
  ]);
  qs[qi]._opts = opts;
  const art = monImg(t);
  $('#quiz').innerHTML =
    `<div class="field" id="field">` +
    `<div class="hud"><span>第 ${qi + 1}/${qs.length} 关</span>` +
    `<span class="hp"><i style="width:${100 - (qi / qs.length) * 100}%"></i></span>` +
    `<span>识破 ${hits}</span></div>` +
    `<div class="foe" id="foe">` +
    (art ? `<img src="${art}" alt="">` : '') +
    `<div class="plate">${esc(t.term)}</div></div>` +
    `<div class="ask">${ASK[qi % ASK.length]}<small>本环节不教学，只嘲讽</small></div>` +
    `<div id="opts">${opts
      .map(
        (o, i) =>
          `<button class="opt" data-ok="${o.ok}" data-i="${i}">` +
          `<span class="ltr">${LTR[i]}</span>「${hlTerm(o.txt, t)}」</button>`
      )
      .join('')}</div>` +
    `<div id="verdict"></div></div>`;
  $('#opts').onclick = (e) => {
    const b = e.target.closest('.opt');
    if (b && !b.disabled) answer(b, t);
  };
}

function answer(btn, t) {
  const opts = t._opts;
  const ok = btn.dataset.ok === '1';
  ok ? hits++ : misses.push(t);

  [...$('#opts').children].forEach((b, i) => {
    b.disabled = true;
    const o = opts[i];
    b.classList.add(o.ok ? 'yes' : 'no');
    if (!o.ok && b !== btn) b.classList.add('out');
    b.insertAdjacentHTML(
      'beforeend',
      `<span class="why">${o.ok ? '✓ 就他没瞎说' : '✗ ' + BUST[i % BUST.length]}：${esc(o.why)}</span>`
    );
  });

  const f = $('#field');
  if (ok) {
    SFX.play('hit');
    $('#foe').classList.add('dmg');
    f.insertAdjacentHTML('beforeend', `<div class="pop">HIT!</div>`);
  } else {
    SFX.play('miss');
    f.classList.add('hit');
    f.insertAdjacentHTML('beforeend', `<div class="pop">${POP[qi % POP.length]}</div>`);
  }
  setTimeout(() => f.querySelector('.pop')?.remove(), 950);

  const r = [];
  if (t.actually) r.push(`<p><span class="k">真身</span>${hl(t.actually, t)}</p>`);
  if (t.gloss) r.push(`<p><span class="k">人话</span>${esc(t.gloss)}</p>`);
  $('#verdict').innerHTML =
    `<div class="verdict">${r.join('')}</div>` +
    `<button class="go">${qi < qs.length - 1 ? '下一只 →' : '看战绩 →'}</button>`;
  $('.go').onclick = () => {
    SFX.play('page', 1);
    qi++;
    qi < qs.length ? renderQ() : renderResult();
  };
}

function rank(n, total) {
  const r = total ? n / total : 0;
  if (r === 1) return '黑话免疫体 · 建议去当翻译';
  if (r >= 0.7) return '识破率良好 · 会上能救人';
  if (r >= 0.4) return '半信半疑 · 危险区间';
  if (r > 0) return '基本靠猜 · 建议少点头';
  return '全线沦陷 · 你就是黑话本身';
}

function renderResult() {
  /* 结算音跟着评级走：及格线以上放胜利旋律，以下放泄气下行 */
  SFX.play(qs.length && hits / qs.length >= 0.7 ? 'win' : 'lose');
  $('#quiz').innerHTML =
    `<div class="field"><div class="result">` +
    (IMG['mascot-guide'] ? `<img class="guide" src="${IMG['mascot-guide']}" alt="">` : '') +
    `<div class="n">${hits}<small>/${qs.length}</small></div>` +
    `<div class="cap">${rank(hits, qs.length)}</div>` +
    (misses.length
      ? `<div class="leaks"><h4>被糊住的词</h4>${misses
          .map((m) => `<div><b>${esc(m.term)}</b> — ${esc(m.gloss)}</div>`)
          .join('')}</div>`
      : '') +
    `<button class="go" id="again">再来一局</button>` +
    (SUB ? `<a class="lure-btn" href="${esc(SUB)}" target="_blank" rel="noopener noreferrer">＋ 丢个词进来，一起攒这本图鉴</a>` : '') +
    `</div></div>`;
  $('#again').onclick = () => {
    SFX.play('coin'); /* 再来一局＝再投一枚币 */
    startQuiz();
  };
}

}
syncTopH();

/* 手机转屏时 resize 可能早于布局稳定就派发（iOS 尤其），量到的是旧高度；
   orientationchange 后补一次延迟测量。地址栏收起/展开会改视口高度而不改

/* 声音开关：一颗键三态循环 —— 全开（音效+BGM）→ 仅音效 → 全静。
   曾经是并排两颗（🔊 和 ♪），但用户扫一眼只看到「两个管声音的图标」，
   得逐个 hover 才知道差别。三态把同样的能力压进一个位置，且顺序符合直觉：
   音乐最先被嫌吵，所以第一下就关它；再点一下才连音效一起闭嘴。

   图标用内联 SVG 而不是 emoji：🔊 在各系统渲染差异极大（有的糊成一团黑），
   而丝网印风格要的是粗描边线条，emoji 给不了。 */
(function soundToggle() {
  const b = $('#snd');
  if (!b) return;
  /* 喇叭本体 + 三态各自的附加笔画。stroke 全走 currentColor，跟按钮反色联动 */
  const horn = '<path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>';
  const ICON = {
    /* 全开：喇叭 + 两道声波 */
    all: horn + '<path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
    /* 仅音效：只剩一道声波，比「全开」弱一档 */
    sfx: horn + '<path d="M16.5 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
    /* 全静：打叉 */
    off: horn + '<path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  };
  const TIP = {
    all: '声音：音效 + 背景音乐（点击关掉音乐）',
    sfx: '声音：只有音效（点击全部静音）',
    off: '已静音（点击全部打开）',
  };
  const state = () => (!SFX.on ? 'off' : SFX.music ? 'all' : 'sfx');
  const sync = () => {
    const s = state();
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[s]}</svg>`;
    b.classList.toggle('off', s === 'off');
    b.classList.toggle('music', s === 'all'); /* 放着音乐时按钮金底轻脉动 */
    b.title = TIP[s];
    b.setAttribute('aria-label', TIP[s]);
  };
  b.onclick = () => {
    const s = state();
    /* 全开 →（关音乐）仅音效 →（关音效）全静 →（都开）全开 */
    if (s === 'all') SFX.musicToggle();
    else if (s === 'sfx') SFX.toggle();
    else {
      SFX.toggle();
      if (!SFX.music) SFX.musicToggle();
    }
    sync();
  };
  sync();
  window.__syncAudioBtns = sync; /* 开场页选了「配乐」后要回来刷新按钮态 */
})();
route();

/* ================= 投币开场 =================
   四拍：待机闪烁 → 金币落进币口（叮）→ CRT 通电（琶音 + 扫描线）→ 退场。
   这里同时是整站音频的点火点：AudioContext 必须诞生在用户手势里，
   而「点击投币」天然就是第一次手势——把它挪走音效会被浏览器静音策略掐掉。

   全程可跳过：动效跑着的时候再点一下直接落地，不许让开场挡路。 */
(function boot() {
  const el = document.createElement('div');
  el.id = 'boot';
  el.innerHTML =
    `<div class="boot-in">` +
    `<div class="logo">AI 黑话的<br>怪兽图鉴</div>` +
    `<div class="sub">Jargon Bestiary</div>` +
    (IMG['mascot-guide'] ? `<img class="guide" src="${IMG['mascot-guide']}" alt="">` : '') +
    /* 币口是真的投币口：金币动画沿它落下，落点和这个槽对齐 */
    `<div class="slot"><i class="coin-fly"></i><span class="mouth"></span>` +
    `<em class="lit">INSERT COIN</em></div>` +
    `<div class="coin">▶ 点击投币开始 · 已收录 ${TERMS.length} 只</div>` +
    `<div class="ready">CREDIT 1 &nbsp;·&nbsp; PUSH START</div>` +
    `</div>` +
    /* BGM 开关放开场页底角：这是唯一能在「第一声响起之前」够到的地方，
       但它不是主诉求——主诉求是投币。所以做成角落里的一行小字，
       想关的人找得到，不想管的人不会被它挡住视线。 */
    `<div class="bgm-ask"><label><input type="checkbox" id="bgm-opt"` +
    (SFX.music ? ' checked' : '') +
    `><span class="led"></span><span class="txt">背景音乐</span></label></div>` +
    `<div class="crt"></div>`;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';

  let started = false;
  let startedAt = 0;
  let timers = [];
  /* 勾选框自己吞掉点击：不然点它会顺带触发「任意交互即投币」，开场直接跑掉 */
  const optWrap = el.querySelector('.bgm-ask');
  if (optWrap) {
    ['click', 'pointerdown', 'touchstart'].forEach((ev) =>
      optWrap.addEventListener(ev, (e) => e.stopPropagation())
    );
  }
  const done = () => {
    timers.forEach(clearTimeout);
    el.classList.add('gone');
    document.body.style.overflow = '';
    setTimeout(() => el.remove(), 500);
  };

  const start = () => {
    if (started) return; /* 同一次点击的后续事件（见下）不算「再点一次」 */
    started = true;
    startedAt = performance.now();
    el.classList.add('inserting');
    SFX.play('coin'); /* 第一声：AudioContext 在这一刻被创建 */
    /* 用户在开场页勾了配乐 -> 现在落地。BGM 必须搭这趟手势的车启动，
       否则自动播放策略会把它挂起。 */
    const opt = el.querySelector('#bgm-opt');
    if (opt && opt.checked !== SFX.music) SFX.musicToggle();
    else SFX.musicResume(); /* 上次开着的，这次自动续上 */
    window.__syncAudioBtns?.();
    /* 减弱动效偏好下，全局 CSS 把动画压到 0.01ms，再等 1.5 秒就是干瞪眼。
       声音留着（那不是动效），画面直接进场。 */
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      SFX.play('boot');
      return timers.push(setTimeout(done, 120));
    }
    /* 金币落到底 → 机器通电 → 亮一下 → 走人。时序和 CSS 动画长度对齐 */
    timers.push(setTimeout(() => {
      el.classList.add('powered');
      SFX.play('boot');
    }, 620));
    timers.push(setTimeout(done, 1560));
  };

  /* 「再点一下跳过」必须挡住同一次点击的事件级联。
     一次触屏轻点会依次派发 pointerdown → touchstart → pointerup → touchend → click，
     每个都命中这里；照字面实现「第二次调用就跳过」的话，touchstart 会立刻
     把刚开场的动画掀掉——手机上永远看不到投币动效，桌面鼠标反而正常
     （mousedown/mouseup 不在监听列表里，只有 pointerdown + click 两发）。
     用时间窗判定：360ms 内的重复事件都属于同一次点击，不算跳过。 */
  const poke = () => {
    if (!started) return start();
    if (performance.now() - startedAt > 360) done();
  };

  ['click', 'pointerdown', 'touchstart'].forEach((ev) =>
    el.addEventListener(ev, poke, { passive: true })
  );
  el.addEventListener('wheel', poke, { passive: true });
  document.addEventListener('keydown', function k(e) {
    if (e.key === 'Tab') return; /* 留给键盘用户先看清界面 */
    poke();
    document.removeEventListener('keydown', k);
  });
})();

</script>

</body>
</html>
